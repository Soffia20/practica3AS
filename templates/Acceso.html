<!--  -->
<form id="frmAcceso">

    <div class="mb-1">
        <label class="fw-bold">ID Estudiante</label>
        <input type="number" class="form-control" id="IdEstudiante" name="IdEstudiante">
    </div>

    <div class="mb-1">
        <label class="fw-bold">ID Laboratorio</label>
        <input type="number" class="form-control" id="IdLaboratorio" name="IdLaboratorio">
    </div>

    <div class="d-flex gap-2 mt-3">

        <!-- COMMAND: Registrar Entrada -->
        <button type="button" id="btnEntrada" class="btn btn-success flex-fill">
            Registrar Entrada
        </button>

        <!-- COMMAND: Registrar Salida -->
        <button type="button" id="btnSalida" class="btn btn-danger flex-fill">
            Registrar Salida
        </button>
    </div>

    <div class="input-group mt-4 mb-3">
        <input type="date" class="form-control" id="txtBuscarFecha">
        <button class="btn btn-secondary" id="btnBuscarFecha" type="button">Buscar</button>
    </div>

    <div class="table-responsive">
        <table class="table table-sm">
            <thead class="table-active">
                <tr>
                    <th>ID</th>
                    <th>Estudiante</th>
                    <th>Laboratorio</th>
                    <th>Entrada</th>
                    <th>Salida</th>
                    <th>Tipo</th>
                    <th>Funciones</th>
                </tr>
            </thead>
            <tbody id="tbodyAcceso"></tbody>
        </table>
    </div>


</form>
