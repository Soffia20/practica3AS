<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<form id="frmLaboratorio" method="post">
    <div ng-controller="SesionController"
        class="position-fixed top-0 start-0 m-3 d-flex align-items-center bg-light rounded shadow-sm p-2"
        style="z-index: 1050; min-width: 220px;">
        
    <!-- Ícono de usuario -->
    <i class="bi bi-person-circle fs-3 me-2 text-primary"></i>

    <!-- Datos de sesión -->
    <div class="d-flex flex-column">
        <p class="mb-0 fw-semibold">{{ "{{ SesionService.getUsuario() }}" }}</p>
        <small class="text-muted">{{ "{{ SesionService.getTipo() }}" }}</small>
    </div>
    </div>

    <div class="mb-1">
        <label>Hora</label>
        <input type="text" class="form-control" id="txtHora" name="txtHora">
    </div>
        <div class="mb-1">
        <label>Categoria</label>
        <input type="text" class="form-control" id="txtCategoria" name="txtCategoria">
    </div>
    <div class="mb-1 text-end">
        <button type="submit" id="btnGuardarHora" class="btn btn-primary">Guardar</button>
    </div>
</form>

<div class="mb-3 input-group">
    <input type="text" class="form-control" id="txtBuscarHora" placeholder="Buscar hora">
    <button class="btn btn-secondary" id="btnBuscarHora" type="button">Buscar</button>
</div>

<div class="table-responsive">
    <table class="table table-sm">
        <thead class="table-active">
            <tr>
                <th>Id</th>
                <th>Hora</th>
                <th>Categoria</th>
            </tr>
        </thead>
        <tbody id="tbodylaboratorio"></tbody>
    </table>
</div>
<div class="row">
  <div class="col-md-6 col-lg-4 col-xl-3 col-xxl-3" ng-repeat="laboratorio in categoriaAM.laboratorio">
    <h5 class="text-center">{{ "{{categoriaAM.titulo}}" }}</h5>
    <div class="card text-bg-info mb-3">
      <div class="card-header">Horario de Laboratorio</div>
      <div class="card-body">
        <h5 class="card-title">{{ "{{laboratorio.Hora}}" }}</h5>
        <p class="card-text"></p>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-md-6 col-lg-4 col-xl-3 col-xxl-3" ng-repeat="laboratorio in categoriaPM.laboratorio">
    <h5 class="text-center">{{ "{{categoriaPM.titulo}}" }}</h5>
    <div class="card text-bg-info mb-3">
      <div class="card-header">Horario de Laboratorio</div>
      <div class="card-body">
        <h5 class="card-title">{{ "{{laboratorio.Hora}}" }}</h5>
        <p class="card-text"></p>
      </div>
    </div>
  </div>
</div>
